# Recordatorios de TaskAI por correo, ejecutados en los servidores de GitHub (funciona con el PC apagado).
# Lógica en automation/enviar_recordatorios.py. Secretos necesarios (Settings > Secrets and variables > Actions):
#   DATABASE_URL, GMAIL_USER, GMAIL_APP_PASSWORD
name: Recordatorios por correo

on:
  schedule:
    # Cada hora, a y 17, de 8:17 a 21:17 de Bogotá (UTC-5) = de 13:17 a 02:17 UTC.
    # Se evita la hora en punto: es el momento de más carga en GitHub, que entonces retrasa y
    # DESCARTA ejecuciones programadas. A :00 solo se ejecutaban ~4 de 14 al día (oct. 2026).
    # El script descarta las que caigan fuera de 8:00-21:59 de Bogotá.
    - cron: "17 13-23 * * *"
    - cron: "17 0-2 * * *"
  # Lanzamiento por API o con el botón "Run workflow".
  # - Botón manual: ignora la ventana horaria (para probar a cualquier hora).
  # - Disparador externo (cron-job.org, cada hora): envía programado=true y SÍ respeta la ventana.
  #   Existe porque el programador de GitHub (arriba) descartaba la mayoría de ejecuciones; se
  #   mantiene como respaldo. No hay duplicados: cada aviso se marca al enviarse y "concurrency"
  #   impide dos ejecuciones a la vez.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo simular (no envía correos ni marca tareas)"
        type: boolean
        default: false
      programado:
        description: "Ejecución programada externa (respeta 8:00-21:59). Déjalo sin marcar al probar."
        type: boolean
        default: false

# Nunca dos ejecuciones a la vez: podrían enviar el mismo aviso dos veces.
concurrency:
  group: recordatorios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Instalar dependencias
        run: pip install -r automation/requirements.txt

      - name: Pruebas del script (sin red)
        run: python -m unittest discover -s automation

      - name: Enviar recordatorios
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ES_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          PROGRAMADO: ${{ inputs.programado }}
          SIMULAR: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$ES_MANUAL" = "true" ] && [ "$PROGRAMADO" != "true" ]; then ARGS="--forzar"; fi
          if [ "$SIMULAR" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python automation/enviar_recordatorios.py $ARGS
