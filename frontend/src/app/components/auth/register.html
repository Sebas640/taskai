<div class="auth-page">
  <div class="bg-grid"></div>
  <div class="bg-glow blob-1"></div>
  <div class="bg-glow blob-2"></div>

  <div class="auth-card">
    <a routerLink="/" class="back-link">
      <span>←</span>
      <span class="brand">🚀 TaskAI</span>
      <span class="sep">•</span>
      <span>Volver al inicio</span>
    </a>

    <h1 class="auth-title">Crear cuenta</h1>
    <p class="auth-subtitle">Empieza a organizar tus tareas con ayuda de Gemini.</p>

    <form (ngSubmit)="onRegister()" class="auth-form">
      <div class="field">
        <label for="full_name">Nombre completo</label>
        <input
          id="full_name"
          type="text"
          name="full_name"
          [(ngModel)]="full_name"
          placeholder="Tu nombre"
          [disabled]="isLoading"
          autocomplete="name"
          required
        />
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="tucorreo@ejemplo.com"
          [disabled]="isLoading"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          [disabled]="isLoading"
          autocomplete="new-password"
          required
        />
      </div>

      <div *ngIf="errorMessage" class="error-box">{{ errorMessage }}</div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Crear Cuenta</span>
        <span *ngIf="isLoading" class="spinner">Creando cuenta...</span>
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
    </p>
  </div>
</div>
